<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b"><title>Nyaraka za Dereva | ZUNE Delivery"><link rel="stylesheet" href="./auth.css?v=3"><style>
.docs-shell{max-width:900px;margin:auto;padding:22px}.docs-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.docs-head a{color:#087f5b;font-weight:700;text-decoration:none}.docs-intro{background:#e7f4ee;border:1px solid #cce7d8;border-radius:16px;padding:16px;margin-bottom:18px;line-height:1.6}.docs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.doc-card{background:#fff;border:1px solid #e1ebe6;border-radius:16px;padding:16px;display:grid;gap:9px}.doc-card h3{font-size:15px;margin:0}.doc-card p{font-size:12px;color:#687a73;margin:0;line-height:1.5}.doc-card input{width:100%;padding:10px;border:1px solid #d8e4de;border-radius:10px}.doc-card small{color:#687a73}.doc-state{font-size:11px;font-weight:800;color:#8a6a24}.doc-state.approved{color:#087f5b}.doc-state.rejected{color:#b42318}.docs-actions{display:flex;gap:10px;align-items:center;margin:18px 0}.docs-actions button{border:0;border-radius:11px;background:#087f5b;color:white;padding:13px 18px;font-weight:800}.docs-actions button:disabled{opacity:.5}.docs-note{font-size:12px;color:#687a73}.doc-required{color:#b42318}.docs-message{padding:12px;border-radius:12px;background:#e9f6ef;margin:12px 0}.docs-message.error{background:#fff0ee;color:#a42b22}@media(max-width:650px){.docs-grid{grid-template-columns:1fr}.docs-shell{padding:14px}}
</style></head><body><main class="docs-shell">
<header class="docs-head"><div><b style="color:#087f5b;letter-spacing:.12em">ⓏⓊⓃⒺ DELIVERY</b><h1 style="margin:8px 0 0">Nyaraka za dereva</h1></div><a href="./index.html">Rudi dashboard</a></header>
<div class="docs-intro"><b>Hatua ya uthibitishaji</b><br>Pakia nyaraka halali na zinazoonekana vizuri. Nyaraka zako ni za siri; zitaonekana kwako na kwa Admin Mkuu pekee. Unaweza kuhifadhi na kuendelea baadaye.</div>
<div id="docsMessage" class="docs-message" hidden role="status"></div>
<section id="docsGrid" class="docs-grid">
<article class="doc-card" data-type="national_id"><h3>1. Kitambulisho cha Taifa (NIDA) <span class="doc-required">*</span></h3><p>Picha ya mbele/nyuma au PDF yenye taarifa zinazosomeka.</p><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><small class="doc-state">Haijapakiwa</small></article>
<article class="doc-card" data-type="driver_photo"><h3>2. Picha ya dereva <span class="doc-required">*</span></h3><p>Picha ya uso inayoonekana vizuri, bila miwani inayoficha uso.</p><input type="file" accept="image/jpeg,image/png,image/webp" required><small class="doc-state">Haijapakiwa</small></article>
<article class="doc-card" data-type="driving_license"><h3>3. Leseni ya udereva <span class="doc-required">*</span></h3><p>Leseni halali ya aina ya chombo unachotumia.</p><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><label>Muda wa kuisha (ikiwa unaonekana)<input type="date" data-expiry></label><small class="doc-state">Haijapakiwa</small></article>
<article class="doc-card" data-type="vehicle_registration"><h3>4. Kadi ya usajili wa chombo <span class="doc-required">*</span></h3><p>Kadi ya usajili ya pikipiki/gari unalotumia.</p><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><small class="doc-state">Haijapakiwa</small></article>
<article class="doc-card" data-type="vehicle_insurance"><h3>5. Bima ya chombo <span class="doc-required">*</span></h3><p>Uthibitisho wa bima iliyo hai kwa chombo husika.</p><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><label>Muda wa kuisha<input type="date" data-expiry></label><small class="doc-state">Haijapakiwa</small></article>
<article class="doc-card" data-type="vehicle_photo"><h3>6. Picha ya chombo</h3><p>Picha inayoonyesha chombo na namba ya usajili.</p><input type="file" accept="image/jpeg,image/png,image/webp"><small class="doc-state">Hiari</small></article>
<article class="doc-card" data-type="vehicle_authorization"><h3>7. Ruhusa ya kutumia chombo</h3><p>Inahitajika ikiwa chombo si mali yako. Inaweza kuwa barua au makubaliano.</p><input type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><small class="doc-state">Inahitajika ikiwa chombo si chako</small></article>
</section>
<div class="docs-actions"><button id="saveDocs" type="button">Hifadhi nyaraka</button><span class="docs-note">Picha/PDF · Kiwango cha juu 10 MB kwa kila faili.</span></div>
</main><script type="module" src="./driver-documents.js?v=1"></script></body></html>
