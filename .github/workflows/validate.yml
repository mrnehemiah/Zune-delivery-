name: ZUNE Delivery source validation
on:
  push:
    branches: [main, integration/order-lifecycle]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          for file in *.js; do
            node --input-type=module --check < "$file"
          done
